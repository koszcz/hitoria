<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#21486a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Hitoria</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <header id="topbar">
      <div class="brand">Hitoria</div>
      <div id="res"></div>
      <button id="menu">☰</button>
      <div id="file">
        <button data-file="save" title="Save the game you are playing (Ctrl+S)">💾 Save</button>
        <button data-file="saves" title="Load, save as new, delete saves, or change the autosave">📂 Saves</button>
        <button data-file="new" title="Start a new island">🏝️ New</button>
        <button data-file="report" title="Something looks wrong? Make a report for Claude. Press F3 for live diagnostics.">🐞 Report</button>
        <button data-file="graphics" title="Graphics quality. Auto lowers it when the game runs slowly.">🖥️ Graphics: Auto</button>
        <button data-file="sound" title="Wind and waves. Click or press M to mute.">🔊 Sound: On</button>
        <button data-file="lang" title="Graj po polsku">🇵🇱 Polski</button>
      </div>
      <aside id="goal"></aside>
      <div id="speed">
        <button data-speed="pause" title="Pause (space)">⏸</button>
        <button data-speed="1">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
      </div>
    </header>
    <aside id="info" hidden></aside>
    <div id="toasts"></div>
    <button id="done" hidden></button>
    <nav id="buildbar"></nav>
    <div id="help">Drag to pan · Scroll to zoom · 1–5 to build · R road · X remove · Right-click to cancel · Ctrl+S save · M mute · F3 diagnostics</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
