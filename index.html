<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hitoria</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <header id="topbar">
      <div class="brand">Hitoria</div>
      <div id="res"></div>
      <div id="speed">
        <button data-speed="pause" title="Pause (space)">⏸</button>
        <button data-speed="1">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
      </div>
    </header>
    <aside id="info" hidden></aside>
    <div id="toasts"></div>
    <nav id="buildbar"></nav>
    <div id="help">Drag to pan · Scroll to zoom · 1–5 to build · R road · X remove · Right-click to cancel</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
